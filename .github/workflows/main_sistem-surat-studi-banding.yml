# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - Sistem-surat-studi-banding

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6C5C32316EE8495EAD41F845D727FCCA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_200AC6E590E6454A8748CF0DA2BCBF96 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2F2ECB6CA09B444A8CE2B2FAD96039D9 }}

      - name: 'Deploy to Azure Web App (attempt 1)'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp-attempt-1
        continue-on-error: true
        with:
          app-name: 'Sistem-surat-studi-banding'
          slot-name: 'Production'
          package: .

      - name: Wait before retrying deploy
        if: steps.deploy-to-webapp-attempt-1.outcome == 'failure'
        run: sleep 30

      - name: 'Deploy to Azure Web App (retry)'
        if: steps.deploy-to-webapp-attempt-1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp-attempt-2
        with:
          app-name: 'Sistem-surat-studi-banding'
          slot-name: 'Production'
          package: .
          